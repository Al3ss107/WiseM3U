services:
  wisem3u:
    image: wisem3u:latest
    build: .
    container_name: wisem3u
    restart: unless-stopped
    # bridge network: the container gets its own IP on the docker0 network and the
    # host port 7300 is published on container port 7000
    network_mode: bridge
    ports:
      - "7300:7000"
    environment:
      - PORT=7000
      # externally visible port: only used to show the correct URLs
      # (manifest, playlist) in the configuration page
      - PUBLIC_PORT=7300
      - CONFIG_FILE=/data/config.json
      - CACHE_DIR=/data/cache
      # Token protecting the configuration page (optional but recommended
      # se la porta 7300 e' raggiungibile da internet)
      - ADMIN_TOKEN=
      # Client-facing token (optional): applied automatically to the
      # manifest/playlist links; it is not saved in config.json
      - ACCESS_TOKEN=
      - TZ=Europe/Rome
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
